name: bump gbrain

on:
  schedule:
    # Upstream cuts releases frequently; check often and bump when the tag moves.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to pin (for example v0.60.529.0); empty means latest"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-gbrain
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$(gh api repos/garrytan/gbrain/releases/latest --jq .tag_name)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Compare with the pinned version
        id: pinned
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          current=$(sed -n 's|.*releases/download/v\([0-9.]*\)/.*|\1|p' Formula/gbrain.rb | head -1)
          echo "pinned: $current; upstream: $VERSION"
          if [ "$current" = "$VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets and hash them
        id: assets
        if: steps.pinned.outputs.changed == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          base="https://github.com/garrytan/gbrain/releases/download/${TAG}"
          dir="$RUNNER_TEMP/gbrain-assets"
          mkdir -p "$dir"
          for asset in gbrain-darwin-arm64 gbrain-linux-x64; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$dir/$asset" "$base/$asset"
          done
          echo "darwin=$(sha256sum "$dir/gbrain-darwin-arm64" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux=$(sha256sum "$dir/gbrain-linux-x64" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Rewrite the formula
        if: steps.pinned.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          DARWIN_SHA: ${{ steps.assets.outputs.darwin }}
          LINUX_SHA: ${{ steps.assets.outputs.linux }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          path = pathlib.Path("Formula/gbrain.rb")
          text = path.read_text()

          version = os.environ["VERSION"]
          text, n = re.subn(r'releases/download/v[0-9][^/]*/', f'releases/download/v{version}/', text)
          assert n == 2, "versioned release URLs not found"

          for asset, sha in (
              ("gbrain-darwin-arm64", os.environ["DARWIN_SHA"]),
              ("gbrain-linux-x64", os.environ["LINUX_SHA"]),
          ):
              pattern = re.compile(r'(%s"\n\s*sha256 ")([0-9a-f]{64})(")' % re.escape(asset))
              text, n = pattern.subn(lambda m, sha=sha: m.group(1) + sha + m.group(3), text, count=1)
              assert n == 1, f"sha256 for {asset} not found"

          path.write_text(text)
          print(f"pinned gbrain {version}")
          PY
          git diff -- Formula/gbrain.rb

      - name: Commit and push
        if: steps.pinned.outputs.changed == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/gbrain.rb; then
            echo "formula is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gbrain.rb
          git commit -m "gbrain: update to ${TAG}"
          git pull --rebase origin main
          git push origin main

      - name: Validate the new formula on macOS
        if: steps.pinned.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
