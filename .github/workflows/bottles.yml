name: bottles

# Build this tap's source-built formulae as pre-compiled bottles, publish them
# to the repository's GitHub Releases, and commit the regenerated
# `bottle do` blocks. `brew install` downloads a bottle instead of compiling
# when the formula has one for the current platform, which covers the C builds
# (libntfs-3g, ntfsprogs, partclone, sasquatch), the pinned Ghidra keg plus
# ghidra-mcp's Python venv, and unblob's Python/wheel install.
#
# Only the current stable macOS is bottled: the workflow pins `macos-26`, today's
# latest stable arm64 image, and Homebrew's older-macOS fallback serves that
# bottle on macOS 27 too. Older macOS releases build from source.
#
# This workflow owns the `bottle do` blocks: it rebuilds them from the assets it
# uploads, so a formula must not carry a block for a version or revision it was
# not built for. The bump scripts drop the block when upstream moves; a
# hand-made repair that changes `version` or `revision` must drop it too (see
# AGENTS.md).
#
# All seven formulae are rebuilt together on purpose: partclone links against
# libntfs-3g, ghidra-mcp's extension and venv target the pinned ghidra@12.1 keg,
# and rebuilding the set keeps every bottle consistent with the tap's
# dependencies.
#
# ghidra@12.1 is the large one: its bottle is about 543 MB, still well inside
# GitHub's 2 GB per-asset limit and the job timeouts, and it is what makes
# ghidra-mcp installs fast. The publish job keeps only the bottles it just
# built and prunes older release assets, so the `bottles` release does not grow
# into a version history.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Formula/libntfs-3g.rb"
      - "Formula/ntfsprogs.rb"
      - "Formula/partclone.rb"
      - "Formula/sasquatch.rb"
      - "Formula/ghidra-mcp.rb"
      - "Formula/ghidra@12.1.rb"
      - "Formula/unblob.rb"
      - "Patches/partclone-darwin.patch"
      - "Patches/sasquatch-darwin.patch"

permissions:
  contents: write

concurrency:
  group: bottles
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # All bottles live in one release; asset names carry the formula version, so
  # publishing a new version adds assets instead of replacing the ones current
  # installs are using. The name is not a version tag on purpose: it holds the
  # assets for every bottled version the tap has published.
  BOTTLE_ROOT_URL: https://github.com/fmu/tap/releases/download/bottles

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Bottles describe main; a manual dispatch from another branch
          # still builds and commits what users install.
          ref: main
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this checkout
        run: |
          brew tap fmu/tap "file://${GITHUB_WORKSPACE}"
          brew trust fmu/tap
      - name: Build the bottles
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          mkdir -p bottles
          cd bottles

          # Install every formula with --build-bottle in dependency order
          # (partclone links libntfs-3g, unblob drives partclone and
          # sasquatch, ghidra-mcp targets the ghidra@12.1 keg) and test the
          # source build before packaging it.
          for name in libntfs-3g ntfsprogs sasquatch partclone ghidra@12.1 ghidra-mcp unblob; do
            brew install --build-bottle "fmu/tap/$name"
            brew test "fmu/tap/$name"
          done

          for name in libntfs-3g ntfsprogs sasquatch partclone ghidra@12.1 ghidra-mcp unblob; do
            # --no-rebuild keeps the bottle at rebuild 0: a change to installed
            # files already bumps `revision` (AGENTS.md), which changes the
            # package version and therefore the bottle filename.
            brew bottle --json --no-rebuild --root-url="${BOTTLE_ROOT_URL}" "fmu/tap/$name"
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: bottles
          path: |
            ${{ runner.temp }}/bottles/*.bottle.tar.gz
            ${{ runner.temp }}/bottles/*.bottle.json
          # The bottles are already gzipped; recompressing them only burns
          # runner time on the 543 MB ghidra bottle. Keep the transient
          # artifact for a day.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Bottles describe main; a manual dispatch from another branch
          # still builds and commits what users install.
          ref: main
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this checkout
        run: |
          brew tap fmu/tap "file://${GITHUB_WORKSPACE}"
          brew trust fmu/tap
      - name: Download the bottles
        uses: actions/download-artifact@v4
        with:
          name: bottles
          path: ${{ runner.temp }}/bottles
      - name: Merge the bottle metadata into the tap
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/bottles"
          ls -l

          # `brew bottle --merge` reads the previous bottle block relative to
          # the tap's origin/HEAD when deciding whether to increment `rebuild`;
          # a file:// tap clone does not always get that ref.
          tap="$(brew --repository fmu/tap)"
          git -C "$tap" remote set-head origin --auto >/dev/null 2>&1 || true

          brew bottle --merge --write --no-commit *.bottle.json
      - name: Audit the bottled formulae
        run: |
          set -euo pipefail
          for name in libntfs-3g ntfsprogs sasquatch partclone ghidra@12.1 ghidra-mcp unblob; do
            brew audit --strict "fmu/tap/$name"
          done
      - name: Copy the bottle blocks into the checkout
        run: |
          set -euo pipefail
          tap="$(brew --repository fmu/tap)"
          for name in libntfs-3g ntfsprogs sasquatch partclone ghidra@12.1 ghidra-mcp unblob; do
            cp "$tap/Formula/$name.rb" "Formula/$name.rb"
          done
          git diff --stat
      - name: Replace matching assets from an earlier attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/bottles"
          if ! gh release view bottles --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          python3 - <<'PY' > "${RUNNER_TEMP}/assets.txt"
          import glob
          import json

          for path in glob.glob("*.bottle.json"):
              for formula in json.load(open(path, encoding="utf-8")).values():
                  for tag in formula["bottle"]["tags"].values():
                      print(tag["filename"])
          PY
          # A re-run rebuilds the same version, so the asset names collide.
          # Normal version bumps add new names and leave current installs alone.
          while IFS= read -r asset; do
            gh release delete-asset bottles "$asset" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          done < "${RUNNER_TEMP}/assets.txt"
      - name: Upload the bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/bottles"
          brew pr-upload --upload-only
      - name: Verify the published bottles
        run: |
          set -euo pipefail
          # Install from the live release in dependency order and run each
          # formula's own test, so a bottle that does not pour blocks the
          # bottle-block commit instead of only failing for users.
          for name in libntfs-3g ntfsprogs sasquatch partclone ghidra@12.1 ghidra-mcp unblob; do
            brew install --force-bottle "fmu/tap/$name"
            brew test "fmu/tap/$name"
          done
      - name: Commit the bottle blocks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then
            echo "no bottle block changes"
            exit 0
          fi
          {
            echo "bottles: publish libntfs-3g, ntfsprogs, partclone, ghidra@12.1, ghidra-mcp, sasquatch, unblob"
            echo
            git diff --cached --stat
          } > "${RUNNER_TEMP}/message"
          git commit -F "${RUNNER_TEMP}/message"
          # The bump workflow may have pushed while this run was building.
          git pull --rebase origin main
          git push origin main
      - name: Keep only the current bottles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/bottles"

          # The release is a cache of the bottles the committed formulae point
          # at, not an archive: prune every asset that this run did not publish
          # so the 543 MB ghidra bottle is not kept per version.
          python3 - <<'PY' > "${RUNNER_TEMP}/current-assets.txt"
          import glob
          import json

          for path in glob.glob("*.bottle.json"):
              for formula in json.load(open(path, encoding="utf-8")).values():
                  for tag in formula["bottle"]["tags"].values():
                      print(tag["filename"])
          PY

          if ! gh release view bottles --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > "${RUNNER_TEMP}/release-assets.txt"; then
            exit 0
          fi
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            grep -qxF "$asset" "${RUNNER_TEMP}/current-assets.txt" && continue
            echo "removing stale bottle asset: $asset"
            gh release delete-asset bottles "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done < "${RUNNER_TEMP}/release-assets.txt"
