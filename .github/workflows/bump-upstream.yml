name: bump upstream

# Re-pin the tap's packages to upstream's latest release. The version comes from
# the release tag and every sha256 is computed from the downloaded release asset;
# `scripts/bump/` holds one script per package.
#
# Three packages are coupled rather than independent:
#
#   rea             `scripts/bump/rea.py` pins the rea-agents npm tarball (for
#                   `rea` and the `rea-full` launcher formula) AND the versioned
#                   engine kegs REA verifies (jadx-headless-mcp@<release>,
#                   kuna@<release>, and the Ghidra pin it shares with
#                   ghidra@12.1). REA is the authority for those pins, so they
#                   are never bumped on their own.
#   jadx-headless-mcp, kuna
#                   the unversioned formulae with those names track upstream's
#                   latest releases and are bumped by their own scripts; REA is
#                   pointed at the pinned @ kegs instead.
#   ghidra-mcp      `scripts/bump/ghidra-mcp.py` only accepts a release whose
#                   Ghidra extension was built for the Ghidra keg the tap pins.
#
# Formula/ghidra@12.1.rb is deliberately absent: it is pinned to one Ghidra
# release for extensions built against that exact version, so it is bumped by
# hand together with the tooling that depends on it. `scripts/bump/rea.py`
# fails the run when REA starts verifying a different Ghidra release instead of
# silently publishing a tap whose packages disagree.
on:
  schedule:
    # Upstream releases at its own pace; a cheap API poll every 30 minutes is
    # enough, and assets are only downloaded once a version has moved.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to bump: all, baocut, designcraft-cli, figcraft-cli, gbrain, ghidra-mcp, iqualize, jadx-headless-mcp, kuna, mesh-llm, mornye, mpv-app, multica-desktop, ntfs-3g, pared, partclone, rea, sasquatch, serena, skippy, solidcraft-cli, unblob, vectorcraft-cli or wordcraft-cli"
        required: false
        default: "all"
      tag:
        description: "Upstream release tag to pin (single package only; for rea use rea-agents-<version>); empty means latest"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-upstream
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Require a single package for a tag override
        if: inputs.tag != ''
        run: |
          if [ "${{ inputs.package }}" = "all" ]; then
            echo "a tag override needs a single package, not 'all'" >&2
            exit 1
          fi

      # Run these two first: rea decides the engine pins, and ghidra-mcp checks
      # its extension against the Ghidra keg that rea's pin keeps in place. A
      # failed coupling check therefore stops the run before any other package
      # has been re-pinned.
      - name: Bump rea (with rea-full and the engines it verifies)
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'rea'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/rea.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump ghidra-mcp
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'ghidra-mcp'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/ghidra-mcp.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump baocut
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'baocut'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/baocut.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump gbrain
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'gbrain'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/gbrain.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump designcraft-cli
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'designcraft-cli'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/designcraft-cli.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump figcraft-cli
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'figcraft-cli'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/figcraft-cli.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump sasquatch
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'sasquatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/sasquatch.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump serena
        # The formula follows oraios/serena's tags and regenerates its Python
        # resources from the tag's uv.lock; see scripts/bump/serena.py.
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'serena'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/serena.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump skippy
        # Skippy's CLI is only attached to the rolling-preview releases, so
        # the script scans releases instead of using the latest stable tag.
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'skippy'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/skippy.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump solidcraft-cli
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'solidcraft-cli'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/solidcraft-cli.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump unblob
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'unblob'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/unblob.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump vectorcraft-cli
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'vectorcraft-cli'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/vectorcraft-cli.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump wordcraft-cli
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'wordcraft-cli'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/wordcraft-cli.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump iqualize
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'iqualize'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/iqualize.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump jadx-headless-mcp
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'jadx-headless-mcp'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/jadx-headless-mcp.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump kuna
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'kuna'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/kuna.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump ntfs-3g (libntfs-3g, ntfsprogs)
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'ntfs-3g'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/ntfs-3g.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump mesh-llm
        # Stable releases only: the mesh-llm host bundle lives there.
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'mesh-llm'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/mesh-llm.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump mornye
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'mornye'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/mornye.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump mpv-app
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'mpv-app'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/mpv-app.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump multica-desktop
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'multica-desktop'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/multica-desktop.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump pared
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'pared'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/pared.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Bump partclone
        if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == 'partclone'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/bump/partclone.py | tee -a "$RUNNER_TEMP/bumped.txt"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only the package files belong in the subject: a Kuna pin move also
          # renames the formula and updates its references in README/CI, and a
          # rename appears under its new name because deleted paths are filtered
          # out.
          bumped_files="$(git diff --cached --name-only --diff-filter=d \
            | grep -E '^(Formula|Casks)/' || true)"
          packages="$(printf '%s\n' "$bumped_files" \
            | sed -e 's|.*/||' -e 's/\.rb$//' \
            | paste -sd, - | sed 's/,/, /g')"
          packages="${packages:-formulae}"
          # Space-separated for the CI dispatch: it validates only these
          # packages and the tap formulae that depend on them.
          bumped_names="$(printf '%s\n' "$bumped_files" \
            | sed -e 's|.*/||' -e 's/\.rb$//' \
            | paste -sd' ' -)"
          echo "BUMPED_PACKAGES=${bumped_names}" >> "$GITHUB_ENV"
          # The source-built formulae are published as bottles by bottles.yml;
          # remember them so that workflow can be dispatched when one moved.
          bottled_names=""
          for name in $bumped_names; do
            case "$name" in
              libntfs-3g|ntfsprogs|partclone|sasquatch|ghidra-mcp|unblob) bottled_names+=" $name" ;;
            esac
          done
          echo "BOTTLED_PACKAGES=${bottled_names# }" >> "$GITHUB_ENV"
          {
            echo "upstream: bump ${packages}"
            echo
            cat "$RUNNER_TEMP/bumped.txt"
          } > "$RUNNER_TEMP/message"
          git commit -F "$RUNNER_TEMP/message"
          git pull --rebase origin main
          git push origin main

      # A push made with the default token does not start other workflows, so
      # ask for the macOS validation explicitly, limited to the packages this
      # run bumped (plus their dependants) instead of the whole tap.
      - name: Validate the bumped packages on macOS
        if: steps.changes.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY" \
          -f packages="$BUMPED_PACKAGES"

      # The CI dispatch installs whatever bottles exist, it does not build new
      # ones. Rebuild the bottles when a bump moved one of the source-built
      # formulae; bottles.yml rebuilds all four together because partclone
      # links libntfs-3g.
      - name: Build bottles for the bumped source packages
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [ -z "${BOTTLED_PACKAGES:-}" ]; then
            echo "no bottled package moved; not rebuilding bottles"
            exit 0
          fi
          gh workflow run bottles.yml --ref main --repo "$GITHUB_REPOSITORY"
